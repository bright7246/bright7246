name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 한 번씩 실행
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://bright7246-cg4cltxcy2z2ksgwbsod2p.streamlit.app'
          method: 'GET'
          timeout: 10000
