name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */11 * * *'  # 11시간마다 실행
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: Mozilla/5.0" "https://bright7246-cg4cltxcy2z2ksgwbsod2p.streamlit.app"
